# CI/CD entrypoint for the GitHub push trigger.
# A push to main builds and deploys both Cloud Run services.

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-backend:latest
      - -f
      - backend/Dockerfile
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-backend:latest

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - booth-backend
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-backend:latest
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=ENV=dev,REGION=asia-south1,AGENT_LOCAL_MODE=true,GCS_DATA_BUCKET=booth-agent-data-dev,GEMINI_MODEL=gemini-2.5-flash,CONSTITUENCIES_MANIFEST_PATH=/constituencies/manifest.json

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-frontend:latest
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL
      - .

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-frontend:latest

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - booth-frontend
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-frontend:latest
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-backend:latest
  - asia-south1-docker.pkg.dev/$PROJECT_ID/booth-agent/booth-frontend:latest

substitutions:
  _NEXT_PUBLIC_API_URL: https://booth-backend-168028165100.asia-south1.run.app

options:
  logging: CLOUD_LOGGING_ONLY
